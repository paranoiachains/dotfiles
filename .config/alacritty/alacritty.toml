[env]
TERM = "xterm-256color"

[cursor]
style = "Beam"

[font]
normal = { family = "FiraCode Nerd Font", style = "Regular" }
bold = { family = "FiraCode Nerd Font", style = "Bold" }
italic = { family = "FiraCode Nerd Font", style = "Italic" }
size = 12.0

[window]
padding = { x = 12, y = 10 }
dynamic_padding = true
decorations = "full"
startup_mode = "Windowed"
title = "Alacritty"
opacity = 1

[window.class]
general = "Alacritty"
instance = "Alacritty"

[scrolling]
history = 10000

[keyboard]
bindings = [{ key = "V", mods = "Control", action = "ToggleViMode" }]
